name: Bug report
description: Something in pondok-ai does not work as expected
title: '[BUG] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search the [existing issues](https://github.com/rasidi3112/pondok-ai/issues) first.
        Security problems go through [private vulnerability reporting](https://github.com/rasidi3112/pondok-ai/security/advisories/new), not here.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npx pondok-ai init --preset ...
        2. npx pondok-ai up
        3. See error
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `pondok-ai doctor`
      description: Run `npx pondok-ai doctor` and paste the output. Remove anything you consider private.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: pondok-ai version
      description: Output of `npx pondok-ai --version`.
      placeholder: 0.3.1
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (x86_64)
        - Linux (arm64)
        - Windows (WSL2)
        - Windows (native)
        - Other
    validations:
      required: true
  - type: dropdown
    id: gpu
    attributes:
      label: GPU
      options:
        - None (CPU only)
        - NVIDIA
        - Apple Metal (native Ollama)
        - AMD
        - Other
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: For example `npx pondok-ai logs <service>`, or Docker output.
      render: text
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Docker Desktop version, models in use, anything else that helps.
